[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acade2sql"
version = "0.3.0"
description = "Convert AutoCAD Electrical Access databases (.mdb/.accdb) to SQL via SQLAlchemy"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    # access-parser (Apache-2.0): TDEF parsing for the pure-Python reader (--reader pure).
    "access-parser>=0.0.6,<0.1",
    "construct>=2.10",  # imported directly for ConstructError (access-parser's parser library)
    "pyodbc>=4.0.35",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
# Kept for compatibility: access-parser is a core dependency since 0.3.0.
fallback = []
postgresql = ["psycopg[binary]>=3.1"]
# SQL Server uses pyodbc (a core dependency) + Microsoft "ODBC Driver 17/18 for SQL Server".
mssql = []

[project.scripts]
acade2sql = "acade2sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
