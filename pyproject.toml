[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acade2sql"
version = "0.1.0"
description = "Convert AutoCAD Electrical Access databases (.mdb/.accdb) to SQL via SQLAlchemy"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pyodbc>=4.0.35",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
fallback = ["access-parser"]

[project.scripts]
acade2sql = "acade2sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
